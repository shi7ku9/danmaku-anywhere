<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Danmaku</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <p id="page"></p>
      <label class="row">
        <input id="toggle" type="checkbox" />
        <span>Show danmaku</span>
        <span id="mode" class="muted"></span>
      </label>
      <button id="import" type="button">Import file…</button>
    </section>

    <section id="offset-row" class="row" hidden>
      <span>Offset</span>
      <button id="offset-minus" type="button">−1s</button>
      <input id="offset" type="number" step="0.1" />
      <button id="offset-plus" type="button">+1s</button>
    </section>

    <section>
      <label class="slider">
        <span>Opacity <output id="opacity-value"></output></span>
        <input id="opacity" type="range" min="0.1" max="1" step="0.05" />
      </label>
      <label class="slider">
        <span>Font size <output id="fontScale-value"></output></span>
        <input id="fontScale" type="range" min="0.5" max="2" step="0.1" />
      </label>
      <label class="slider">
        <span>Speed <output id="speed-value"></output></span>
        <input id="speed" type="range" min="4" max="16" step="1" />
      </label>
    </section>

    <details>
      <summary>Library (<span id="library-count">0</span>)</summary>
      <ul id="library"></ul>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
