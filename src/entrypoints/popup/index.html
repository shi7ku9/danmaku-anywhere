<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Danmaku</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true">弾</div>
      <h1>Danmaku</h1>
      <span id="mode" class="badge" hidden></span>
    </header>

    <section id="page-card" class="card">
      <div class="row">
        <div class="page-info">
          <div id="page" class="page-title"></div>
          <div id="page-meta" class="meta"></div>
        </div>
        <input id="toggle" class="switch" type="checkbox" role="switch" aria-label="Show danmaku" />
      </div>
      <button id="import" class="button" type="button">Import file…</button>
    </section>

    <section id="offset-row" class="card" hidden>
      <div class="label">Offset</div>
      <div class="stepper">
        <button id="offset-minus" class="chip" type="button" aria-label="Offset minus one second">−1s</button>
        <label class="offset-value">
          <input id="offset" type="number" step="0.1" aria-label="Offset in seconds" />
          <span>s</span>
        </label>
        <button id="offset-plus" class="chip" type="button" aria-label="Offset plus one second">+1s</button>
      </div>
    </section>

    <section class="card">
      <div class="preview" aria-hidden="true"><span id="preview">弾幕 Danmaku preview</span></div>
      <label class="slider">
        <span class="row"><span>Opacity</span><output id="opacity-value"></output></span>
        <input id="opacity" type="range" min="0.1" max="1" step="0.05" />
      </label>
      <label class="slider">
        <span class="row"><span>Font size</span><output id="fontScale-value"></output></span>
        <input id="fontScale" type="range" min="0.5" max="2" step="0.1" />
      </label>
      <label class="slider">
        <span class="row"><span>Speed</span><output id="speed-value"></output></span>
        <input id="speed" type="range" min="4" max="16" step="1" />
      </label>
    </section>

    <details class="advanced">
      <summary>
        <span>Advanced style</span>
        <span class="chevron" aria-hidden="true">›</span>
      </summary>
      <section class="card">
        <div class="field">
          <div class="label">Effect</div>
          <div class="segmented" role="radiogroup" aria-label="Text effect" data-key="effect">
            <button type="button" role="radio" data-value="outline">Outline</button>
            <button type="button" role="radio" data-value="shadow">Shadow</button>
            <button type="button" role="radio" data-value="both">Both</button>
            <button type="button" role="radio" data-value="none">None</button>
          </div>
        </div>

        <div id="outline-group">
          <label class="slider">
            <span class="row"><span>Outline width</span><output id="outlineWidth-value"></output></span>
            <input id="outlineWidth" type="range" min="0.5" max="4" step="0.5" />
          </label>
          <div class="field">
            <label class="row">
              <span>Outline color</span>
              <input id="outlineColor" class="hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" />
            </label>
            <div class="swatches" role="radiogroup" aria-label="Outline color" data-key="outlineColor"></div>
          </div>
        </div>

        <div id="shadow-group">
          <label class="slider">
            <span class="row"><span>Shadow blur</span><output id="shadowBlur-value"></output></span>
            <input id="shadowBlur" type="range" min="0" max="10" step="1" />
          </label>
          <label class="slider">
            <span class="row"><span>Shadow offset</span><output id="shadowOffset-value"></output></span>
            <input id="shadowOffset" type="range" min="0" max="5" step="0.5" />
          </label>
          <div class="field">
            <label class="row">
              <span>Shadow color</span>
              <input id="shadowColor" class="hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" />
            </label>
            <div class="swatches" role="radiogroup" aria-label="Shadow color" data-key="shadowColor"></div>
          </div>
        </div>

        <div class="field">
          <label class="row">
            <span>Font</span>
            <select id="fontFamily" class="select">
              <option value="system">System</option>
              <option value="sans">Sans-serif</option>
              <option value="serif">Serif</option>
              <option value="mono">Monospace</option>
              <option value="custom">Custom…</option>
            </select>
          </label>
          <input id="fontCustom" class="text" type="text" placeholder="e.g. &quot;Noto Sans TC&quot;, sans-serif" aria-label="Custom font family" />
        </div>

        <div class="field">
          <div class="label">Weight</div>
          <div class="segmented" role="radiogroup" aria-label="Font weight" data-key="fontWeight">
            <button type="button" role="radio" data-value="400">Normal</button>
            <button type="button" role="radio" data-value="700">Bold</button>
          </div>
        </div>

        <div class="field">
          <div class="label">Display area</div>
          <div class="segmented" role="radiogroup" aria-label="Display area" data-key="displayArea">
            <button type="button" role="radio" data-value="0.25">25%</button>
            <button type="button" role="radio" data-value="0.5">50%</button>
            <button type="button" role="radio" data-value="0.75">75%</button>
            <button type="button" role="radio" data-value="1">100%</button>
          </div>
        </div>

        <label class="slider">
          <span class="row"><span>Max on screen</span><output id="maxActive-value"></output></span>
          <input id="maxActive" type="range" min="20" max="300" step="10" />
        </label>

        <button id="reset" class="button" type="button">Reset to defaults</button>
      </section>
    </details>

    <details class="library">
      <summary>
        <span>Library (<span id="library-count">0</span>)</span>
        <span class="chevron" aria-hidden="true">›</span>
      </summary>
      <ul id="library"></ul>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
