# Git hooks; see docs/tooling.md.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{ts,js,json,jsonc,css}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm compile

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: test
      run: pnpm test
